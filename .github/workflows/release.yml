name: sonar-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Full version including build number, e.g. 1.9.0.5762
        required: true
        type: string
      prerelease:
        description: Publish to TestPyPI instead of PyPI
        required: false
        type: boolean
        default: false

jobs:
  prerelease:
    if: ${{ inputs.prerelease }}
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@v7
    with:
      version: ${{ inputs.version }}
      publishToTestPyPI: true
      skipPythonReleasabilityChecks: true
  release:
    if: ${{ !inputs.prerelease }}
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@v7
    with:
      version: ${{ inputs.version }}
      publishToPyPI: true
      skipPythonReleasabilityChecks: true
