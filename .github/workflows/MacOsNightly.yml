name: macOS Nightly Build

on:
  schedule:
    # Run at 3:00 AM UTC every day (5:00 AM CEST / 4:00 AM CET)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      skip_its:
        description: "Skip integration tests"
        required: false
        default: false
        type: boolean

# Only allow one instance of this workflow to run at a time
env:
  MISE_EXPERIMENTAL: "1"
  MISE_PYTHON_GITHUB_ATTESTATIONS: "false"
  UV_PYTHON_DOWNLOADS: "never"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  qa-macos:
    name: "Test macOS Python ${{ matrix.python-version }}"
    runs-on: macos-latest-xlarge
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.13", "3.11.7", "3.12.1", "3.13.2", "3.14.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Cloudflare WARP
        uses: SonarSource/gh-action_setup-cloudflare-warp@v1

      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python ${{ matrix.python-version }}
          experimental: true

      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked

      - name: Execute the test suite
        run: uv run --locked pytest tests/

  its-macos:
    name: "macOS Integration Tests"
    runs-on: macos-latest-xlarge
    if: ${{ !inputs.skip_its }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Setup Cloudflare WARP
        uses: SonarSource/gh-action_setup-cloudflare-warp@v1
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run integration tests
        uses: ./.github/actions/integration-tests
