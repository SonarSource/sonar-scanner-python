name: Build
on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [master, branch-*, dogfood-*]
  pull_request:
  workflow_dispatch:

env:
  MISE_EXPERIMENTAL: "1"
  MISE_PYTHON_GITHUB_ATTESTATIONS: "false"
  UV_PYTHON_DOWNLOADS: "never"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    runs-on: github-ubuntu-latest-s
    outputs:
      build-number: ${{ steps.config-uv.outputs.BUILD_NUMBER }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv
        id: config-uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Stamp numbered version
        run: ./scripts/set_ci_version.sh
      - name: Install dependencies
        run: uv sync --locked
      - name: Build distributions
        run: uv build --no-sources
      - name: Retrieve deployment credentials
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-on-') || startsWith(github.ref, 'refs/heads/feature/long/') }}
        id: artifactory
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # v3.6.1
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer access_token | ARTIFACTORY_DEPLOY_ACCESS_TOKEN;
      - name: Deploy distributions and build metadata
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-on-') || startsWith(github.ref, 'refs/heads/feature/long/') }}
        env:
          ARTIFACTORY_DEPLOY_ACCESS_TOKEN: ${{ steps.artifactory.outputs.vault && fromJSON(steps.artifactory.outputs.vault).ARTIFACTORY_DEPLOY_ACCESS_TOKEN || '' }}
          PROJECT: sonar-scanner-python
          PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
        run: |
          jf config add deploy --url https://repox.jfrog.io --artifactory-url https://repox.jfrog.io/artifactory --access-token "$ARTIFACTORY_DEPLOY_ACCESS_TOKEN" --interactive=false
          jf rt upload 'dist/*' "sonarsource-pypi-public-qa/pysonar/$PROJECT_VERSION/" --flat=true --server-id=deploy --module="pysonar:$PROJECT_VERSION" --build-name="$PROJECT" --build-number="$BUILD_NUMBER"
          jf rt build-collect-env "$PROJECT" "$BUILD_NUMBER"
          jf rt build-publish "$PROJECT" "$BUILD_NUMBER" --server-id=deploy --overwrite \
            --env-include 'PROJECT;GIT_*;*VERSION*;BUILD_*;GITHUB_*;*BRANCH*;*ID;PULL_REQUEST*;ARTIFACTORY*' \
            --env-exclude '*login*;*pass*;*psw*;*pwd*;*secret*;*key*;*token*;*auth*'

  install_deps:
    name: "Install and Cache uv Dependencies"
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - run: |
          uv sync --locked

  formatting:
    name: "Formatting and Licenses headers"
    needs: [install_deps]
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --locked
      - run: |
          uv run --locked black src/ tests/ --check
          uv run --locked licenseheaders -t license_header.tmpl -o "SonarSource Sàrl" -y 2011-2026 -n "Sonar Scanner Python" -E .py -d src/
          uv run --locked licenseheaders -t license_header.tmpl -o "SonarSource Sàrl" -y 2011-2026 -n "Sonar Scanner Python" -E .py -d tests/
          git diff --name-only --exit-code ./src ./tests

  documentation:
    name: "CLI Documentation"
    runs-on: github-ubuntu-latest-s
    needs: [install_deps]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check for incorrect documentation
        run: |
          uv run --locked python tools/generate_cli_documentation.py
          git diff --exit-code CLI_ARGS.md

  coverage:
    name: "Coverage report generation"
    runs-on: github-ubuntu-latest-s
    needs: [install_deps]
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --locked
      - run: |
          uv run --locked pytest --cov-report=xml:coverage.xml --cov-config=pyproject.toml --cov=src --cov-branch tests
          uv run --locked mypy src/ > mypy-report.txt || true
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-reports
          path: |
            coverage.xml
            mypy-report.txt

  analysis:
    name: "NEXT Analysis"
    runs-on: github-ubuntu-latest-s
    needs: [coverage]
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Stamp numbered version
        run: ./scripts/set_ci_version.sh
      - name: Install dependencies
        run: uv sync --locked
      - name: Retrieve analysis credentials
        id: sonar
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # v3.6.1
        with:
          secrets: |
            development/kv/data/next url | NEXT_URL;
            development/kv/data/next token | NEXT_TOKEN;
            development/kv/data/sonarqube-us url | SQC_US_URL;
            development/kv/data/sonarqube-us token | SQC_US_TOKEN;
            development/kv/data/sonarcloud url | SQC_EU_URL;
            development/kv/data/sonarcloud token | SQC_EU_TOKEN;
      - name: Run Sonar analysis
        env:
          NEXT_URL: ${{ fromJSON(steps.sonar.outputs.vault).NEXT_URL }}
          NEXT_TOKEN: ${{ fromJSON(steps.sonar.outputs.vault).NEXT_TOKEN }}
          SQC_US_URL: ${{ fromJSON(steps.sonar.outputs.vault).SQC_US_URL }}
          SQC_US_TOKEN: ${{ fromJSON(steps.sonar.outputs.vault).SQC_US_TOKEN }}
          SQC_EU_URL: ${{ fromJSON(steps.sonar.outputs.vault).SQC_EU_URL }}
          SQC_EU_TOKEN: ${{ fromJSON(steps.sonar.outputs.vault).SQC_EU_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_SHADOW_SCANS: "false"
        run: ./scripts/analyze.sh

  shadow-scans:
    name: Shadow Scans
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: github-ubuntu-latest-s
    needs: [coverage]
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Stamp numbered version
        run: ./scripts/set_ci_version.sh
      - name: Install dependencies
        run: uv sync --locked
      - name: Retrieve analysis credentials
        id: sonar
        uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # v3.6.1
        with:
          secrets: |
            development/kv/data/next url | NEXT_URL;
            development/kv/data/next token | NEXT_TOKEN;
            development/kv/data/sonarqube-us url | SQC_US_URL;
            development/kv/data/sonarqube-us token | SQC_US_TOKEN;
            development/kv/data/sonarcloud url | SQC_EU_URL;
            development/kv/data/sonarcloud token | SQC_EU_TOKEN;
      - name: Run Sonar analysis
        env:
          NEXT_URL: ${{ fromJSON(steps.sonar.outputs.vault).NEXT_URL }}
          NEXT_TOKEN: ${{ fromJSON(steps.sonar.outputs.vault).NEXT_TOKEN }}
          SQC_US_URL: ${{ fromJSON(steps.sonar.outputs.vault).SQC_US_URL }}
          SQC_US_TOKEN: ${{ fromJSON(steps.sonar.outputs.vault).SQC_US_TOKEN }}
          SQC_EU_URL: ${{ fromJSON(steps.sonar.outputs.vault).SQC_EU_URL }}
          SQC_EU_TOKEN: ${{ fromJSON(steps.sonar.outputs.vault).SQC_EU_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_SHADOW_SCANS: "true"
        run: ./scripts/analyze.sh

  iris:
    name: IRIS Sync
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: github-ubuntu-latest-s
    needs: [shadow-scans]
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Run IRIS Analysis
        uses: SonarSource/unified-dogfooding-actions/run-iris@v1
        with:
          primary_project_key: "SonarSource_sonar-scanner-python"
          primary_platform: "Next"
          shadow1_project_key: "SonarSource_sonar-scanner-python"
          shadow1_platform: "SQC-EU"
          shadow2_project_key: "SonarSource_sonar-scanner-python"
          shadow2_platform: "SQC-US"

  qa:
    name: "Test Python ${{ matrix.python-version }}"
    runs-on: github-ubuntu-latest-s
    needs: [install_deps]
    permissions:
      id-token: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.10.13", "3.11.7", "3.12.1", "3.13.2", "3.14.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python ${{ matrix.python-version }}
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --locked
      - name: Execute the test suite
        run: |
          uv run --locked pytest tests/

  qa-windows:
    name: "Test Windows"
    runs-on: github-windows-latest-s
    needs: [install_deps]
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
          experimental: true
      - name: Configure uv for Windows
        uses: SonarSource/ci-github-actions/config-uv@v1
        # The action's final rm -f fails on Windows directory copies; validate setup below.
        continue-on-error: true
        with:
          artifactory-reader-role: private-reader
      - name: Verify uv configuration
        shell: bash
        run: |
          test -n "${CONFIG_UV_COMPLETED:-}"
          test -n "${UV_INDEX_REPOX_USERNAME:-}"
          test -n "${UV_INDEX_REPOX_PASSWORD:-}"
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Clean up local action symlinks
        if: ${{ always() }}
        shell: bash
        run: rm -rf .actions
      - name: Install dependencies
        run: uv sync --locked
      - name: Execute the test suite
        run: |
          uv run --locked pytest tests/

  its:
    name: "Integration Tests"
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run integration tests
        uses: ./.github/actions/integration-tests

  sqc_its:
    name: "SQC Integration Test"
    runs-on: warp-custom-ubuntu-24-04
    permissions:
      id-token: write
      contents: read
    env:
      # Avoid Ryuk's privileged cleanup container; Orchestrator stops its containers and this runner is ephemeral.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.10.2
          tool_versions: |
            python 3.12.1
            gradle 9.4.1
          experimental: true
      - name: Configure uv
        uses: SonarSource/ci-github-actions/config-uv@v1
        with:
          artifactory-reader-role: private-reader
      - name: Select mise Python
        shell: bash
        run: echo "UV_PYTHON=$(mise which python)" >> "$GITHUB_ENV"
      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@v1
        with:
          working-directory: tests/sqc
          artifactory-reader-role: private-reader
        env:
          # This standalone test build has no publishable project version.
          CURRENT_VERSION: "0.0.0"
          PROJECT_VERSION: "0.0.0"
      - name: Resolve SQC distribution version
        id: sqc-distribution
        run: |
          version=$(gradle --project-dir tests/sqc --quiet resolveSqcVersion --no-daemon | sed -n 's/^SQC_DISTRIBUTION_VERSION=//p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache SQC Orchestrator artifacts
        uses: SonarSource/gh-action_cache@v1
        with:
          path: ~/.sonar/orchestrator/cache
          key: sqc-orchestrator-${{ runner.os }}-${{ steps.sqc-distribution.outputs.version }}
      - name: Run SQC integration test
        env:
          SQC_DISTRIBUTION_VERSION: ${{ steps.sqc-distribution.outputs.version }}
        run: |
          uv sync --locked
          uv run --locked gradle -p tests/sqc test --no-daemon -PsonarcloudCoreVersion="$SQC_DISTRIBUTION_VERSION"
      - name: Upload SQC test diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sqc-integration-test-diagnostics
          path: |
            tests/sqc/build/test-results/test/*.xml
            tests/sqc/build/it/**/logs/**

  promote:
    name: "Promote"
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-') }}
    needs:
      [
        build,
        formatting,
        documentation,
        coverage,
        analysis,
        qa,
        qa-windows,
        its,
        sqc_its,
      ]
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Promote
        uses: SonarSource/ci-github-actions/promote@v1
        with:
          promote-pull-request: true
          build-name: sonar-scanner-python
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
